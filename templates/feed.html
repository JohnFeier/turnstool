<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnstool — Active Queue</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 30px; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .category { font-size: 0.85rem; color: #38bdf8; text-transform: uppercase; font-weight: bold; letter-spacing: 0.05em; }
        .title { font-size: 1.5rem; color: #f8fafc; margin: 6px 0; }
        .author { font-size: 0.95rem; color: #94a3b8; margin-bottom: 18px; }
        .link-btn { display: inline-block; background: #0284c7; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; transition: background 0.2s ease; }
        .link-btn:hover { background: #0369a1; }
        .empty-state { text-align: center; color: #64748b; padding: 40px; border: 1px dashed #334155; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>Active Stage (1-Hour FIFO Queue)</h1>

    {% if entries %}
        {% for entry in entries %}
            <div class="card">
                <div class="category">{{ entry.category_name }}</div>
                <div class="title">{{ entry.title }}</div>
                <div class="author">by {{ entry.author_name }}</div>
                <a href="{{ entry.content }}" target="_blank" rel="noopener noreferrer" class="link-btn">Read Work ↗</a>
            </div>
        {% endfor %}
    {% else %}
        <div class="empty-state">
            <p>The queue is currently empty. No active works on stage right now.</p>
        </div>
    {% endif %}
</body>
</html>
