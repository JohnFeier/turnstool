<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnstool — Every Writer Gets Their Turn</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { max-width: 550px; text-align: center; background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #38bdf8; }
        p.tagline { font-size: 1.2rem; color: #94a3b8; margin-bottom: 30px; line-height: 1.5; }
        .form-group { display: flex; gap: 10px; }
        input[type="email"] { flex: 1; padding: 12px 16px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
        button { background: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0369a1; }
        .success { color: #4ade80; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Turnstool</h1>
        <p class="tagline">No algorithms. No hidden metrics. Every writer gets a guaranteed spot in the literary sun.</p>
        
        {% if joined %}
            <p class="success">You're on the list! Welcome as a Founding Creator.</p>
        {% else %}
            <form action="/join" method="POST" class="form-group">
                <input type="email" name="email" placeholder="Enter your email" required>
                <button type="submit">Claim Your Spot</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
